AllCops:
  Exclude:
    - "db/**/*"
    - "bin/**/*"
    - "config/**/*"
    - "script/**/*"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
  TargetRubyVersion: 3.3

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 200

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Style/ClassAndModuleChildren:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
